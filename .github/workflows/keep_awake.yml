name: Keep Streamlit App Awake

on:
  schedule:
    # runs every 6 hours -- well under the 12-hour sleep threshold
    - cron: "0 */6 * * *"
  workflow_dispatch:  # lets you also trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to keep it awake
        run: curl -s -o /dev/null -w "%{http_code}" https://zero-waste-logistics.streamlit.app
